<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Glass Cube</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background: linear-gradient(to bottom, #1a1a1a, #0a0a3a); 
      font-family: Arial, sans-serif;
    }
    canvas { 
      display: block; 
      width: 100vw; 
      height: 100vh; 
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
    }
    #controls button, #controls input {
      margin: 5px;
      padding: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="toggleRotation">Toggle Rotation</button>
    <label for="colorPicker">Base Color: </label>
    <input type="color" id="colorPicker" value="#33ccff">
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

  <script src="myscript.js"></script>
</body>
</html>
